# SPDX-License-Identifier: AGPL-3.0-only
name: OpenFuel
options:
  bundleIdPrefix: ca.openfuel
  deploymentTarget:
    iOS: '17.0'
packages:
  OpenFuelCore:
    path: OpenFuelCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: ca.openfuel.prototype
    GENERATE_INFOPLIST_FILE: false
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: '4'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      INFOPLIST_FILE: OpenFuel/Info-Debug.plist
    Release:
      INFOPLIST_FILE: OpenFuel/Info.plist
targets:
  OpenFuel:
    type: application
    platform: iOS
    sources:
    - path: OpenFuel
      excludes:
      - Info.plist
      - Info-Debug.plist
    dependencies:
    - package: OpenFuelCore
    scheme:
      testTargets:
      - OpenFuelUITests
  OpenFuelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - path: OpenFuelUITests
    dependencies:
    - target: OpenFuel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ca.openfuel.prototype.uitests
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
