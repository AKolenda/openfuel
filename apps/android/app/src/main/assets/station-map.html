<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob: MAP_TILE_ORIGIN; connect-src MAP_CONNECT_SRC; worker-src blob:; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- LiveMap serves these files from the APK; 'self' is never fetched from the network. -->
<link rel="stylesheet" href="leaflet.css"><link rel="stylesheet" href="maplibre-gl.css">
<style>
html,body{height:100%;width:100%;margin:0;background:#edf1ea}#map{position:fixed;inset:0}
.station-pin{background:none;border:0}.station-chip{box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid #285b43;border-radius:13px;background:white;color:#285b43;font:700 15px system-ui;box-shadow:0 1px 3px #0003}
.station-chip.best{border-width:2px}.station-brand{height:29px;display:flex;align-items:center;justify-content:center;font-size:18px}
.leaflet-container .station-brand img{width:29px;height:29px;max-width:29px;object-fit:contain}.station-price{height:23px;line-height:23px}
</style>
<script src="leaflet.js" defer></script><script src="maplibre-gl.js" defer></script><script src="leaflet-maplibre-gl.js" defer></script>
<script src="base-map.js" defer></script><script src="map-style.js" defer></script><script src="station-map.js" defer></script>
</head><body><div id="map" aria-label="Fuel station map"></div></body></html>
