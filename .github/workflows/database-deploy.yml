# SPDX-License-Identifier: AGPL-3.0-only
# Protect the production GitHub Environment with required reviewers BEFORE enabling.
# Do not ALSO enable automatic Supabase GitHub deployment: choose ONE migration deployer.
name: Review and deploy database migrations
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      action:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      confirm_project_ref:
        description: Exact target project ref (required for apply)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: database-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      - name: Validate target, show plan, optionally apply forward migrations
        env:
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm_project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: python tools/database.py "$ACTION" --target "$TARGET" --confirm "$CONFIRM"
