name: Cloudflare deployment preflight
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/web/**', 'apps/docs/**', 'services/edge/**', 'services/live/**', 'packages/data/**', 'package.json', 'package-lock.json', 'tools/**', 'wrangler.jsonc', '.env.example', '.github/workflows/cloudflare-check.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: python tools/project.py site
      - name: Compile/bundle Worker without deployment credentials
        run: npx wrangler deploy --dry-run --outdir .local/worker-bundle
