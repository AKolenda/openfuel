# SPDX-License-Identifier: AGPL-3.0-only
# No signing secrets or publication. Review and pin action commit SHAs before a production pipeline.
name: Native Android
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/android/**', 'packages/mobile/**', 'packages/design/**', 'tools/generate_mobile.py', 'packages/contracts/**', 'tools/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and assemble native debug APK
        run: python tools/project.py android-build
      - name: Fingerprint debug APK
        run: sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: openfuel-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-evidence
          path: evidence/android-build*
          if-no-files-found: warn
