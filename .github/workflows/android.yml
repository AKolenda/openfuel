# SPDX-License-Identifier: AGPL-3.0-only
# No signing secrets or publication. Review and pin action commit SHAs before a production pipeline.
name: Native Android
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/android/**', 'packages/mobile/**', 'packages/design/**', 'tools/generate_mobile.py', 'packages/contracts/**', 'tools/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The runner's current sdkmanager no longer has the retired 'tools' package the action installs by default.
          packages: platform-tools
      - name: Install SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and assemble native debug and release APKs
        run: python tools/project.py android-build
      # The release APK is the download. This runner signs it with its own debug key, so the artifact is for
      # checking the build; a published APK must be built where earlier downloads were signed.
      - name: Fingerprint release APK
        run: sha256sum apps/android/app/build/outputs/apk/release/app-release.apk > apps/android/app/build/outputs/apk/release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: openfuel-android-apk
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-evidence
          path: evidence/android-build*
          if-no-files-found: warn
