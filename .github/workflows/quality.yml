# SPDX-License-Identifier: AGPL-3.0-only
name: Repository quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Generated resources, API contract and site build
        run: python tools/project.py check --web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-check-evidence
          path: evidence/
          if-no-files-found: warn
