# SPDX-License-Identifier: AGPL-3.0-only
name: Expo Android client
on:
  pull_request:
    paths: ['apps/expo/**', '.github/workflows/expo.yml']
  push:
    branches: [main]
    paths: ['apps/expo/**', '.github/workflows/expo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/expo/package-lock.json
      - run: npm --prefix apps/expo ci
      - run: npm --prefix apps/expo run typecheck
      - run: npm --prefix apps/expo test
      - run: npm --prefix apps/expo run export:android
